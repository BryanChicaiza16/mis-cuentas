<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Vida y Cuentas</title>
<meta name="description" content="Pendientes, agenda, hábitos, gastos, tarjetas y ahorro.">
<meta name="theme-color" content="#F6EFEB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Cuentas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}

/* Layout: una columna tipo app de bolsillo, barra de pestañas fija abajo; cifras en mono tabular como libreta de cuentas */
:root{
  --bg:#F6EFEB; --surface:#FFFFFF; --sunk:#F4ECE7; --ink:#211A16; --muted:#766A63; --line:#E9DED7;
  --accent:#5F2A0C; --accent-ink:#FFFFFF; --accent-soft:#FFD9BE; --accent-fuerte:#5F2A0C;
  --naranja:#F2701D; --naranja-claro:#F9AE78; --verde:#8FB339; --oscuro:#2A2622; --oscuro-ink:#FFFFFF;
  --debt:#B4232F; --debt-soft:#F9E0DF; --save:#2F7A4F; --save-soft:#DDF0DF; --warn:#A86A12; --a1:#0F766E; --a2:#2456C7; --a3:#7A3FC4; --a4:#B96A0B; --a5:#B8327A; --a6:#4B6A78;
  --sombra:0 2px 12px rgba(95,42,12,.06); --sombra-c:rgba(95,42,12,.18);
  --f-display:"Urbanist",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Urbanist",ui-sans-serif,system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181311; --surface:#241D19; --sunk:#2E2621; --ink:#F5EDE7; --muted:#B0A299; --line:#3B312B;
  --accent:#FF9E63; --accent-ink:#2A1408; --accent-soft:#4A2C1B; --accent-fuerte:#FFC49C;
  --naranja:#FF8F4C; --naranja-claro:#FFC296; --verde:#B5D66B; --oscuro:#F5EDE7; --oscuro-ink:#211A16;
  --debt:#FF8B93; --debt-soft:#44211F; --save:#7BD9A0; --save-soft:#1D3627; --warn:#F0BE5F; --a1:#4FD1C0; --a2:#8DAAFF; --a3:#C4A4FF; --a4:#F0BE5F; --a5:#FF8AC4; --a6:#9CC0CF;
  --sombra:0 2px 12px rgba(0,0,0,.25); --sombra-c:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181311; --surface:#241D19; --sunk:#2E2621; --ink:#F5EDE7; --muted:#B0A299; --line:#3B312B;
  --accent:#FF9E63; --accent-ink:#2A1408; --accent-soft:#4A2C1B; --accent-fuerte:#FFC49C;
  --naranja:#FF8F4C; --naranja-claro:#FFC296; --verde:#B5D66B; --oscuro:#F5EDE7; --oscuro-ink:#211A16;
  --debt:#FF8B93; --debt-soft:#44211F; --save:#7BD9A0; --save-soft:#1D3627; --warn:#F0BE5F; --a1:#4FD1C0; --a2:#8DAAFF; --a3:#C4A4FF; --a4:#F0BE5F; --a5:#FF8AC4; --a6:#9CC0CF;
  --sombra:0 2px 12px rgba(0,0,0,.25); --sombra-c:rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.status{font-size:.75rem;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:2.4rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 140px;min-width:0}

label{font-size:.8rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:5px}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.money{font-family:var(--f-num);font-size:1.4rem;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.ghost.armed{color:var(--debt)}
.danger{color:var(--debt);border-color:var(--debt);background:transparent}
.danger.armed{background:var(--debt);color:var(--surface)}
.block{width:100%}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:7px 12px;font-weight:600;font-size:.88rem;background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.v.neg{color:var(--debt)} .v.pos{color:var(--save)}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-family:var(--f-num);font-size:.78rem;color:var(--muted)}
.item .d{min-width:0}
.item .d b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .d small{color:var(--muted)}
.item .m{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.deuda{background:var(--debt-soft);color:var(--debt)}
.pill.ahorro{background:var(--save-soft);color:var(--save)}
.pill.fijo{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);font-size:.92rem;padding:6px 0}

.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--debt)}
.bar.save>i{background:var(--save)}
.bar.debt>i{background:var(--debt)}
.cat{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .budget{width:120px;flex:0 0 auto}
.cat .budget input{font-family:var(--f-num);text-align:right;padding:7px 10px}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font-family:var(--f-display);font-size:1.05rem;min-width:9.5em;text-align:center;text-transform:capitalize}
.monthnav button{padding:6px 12px}

.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:9px}

details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600}
summary .num{font-weight:600}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:560px}
.tabs button{border:0;background:transparent;padding:8px 4px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:6;max-width:calc(100% - 32px)}
.note{font-size:.85rem;color:var(--muted)}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}
.alert{border-radius:12px;padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start;background:var(--debt-soft);color:var(--ink)}
.alert b{color:var(--debt)}
.alert.soft{background:var(--accent-soft)}
.alert.soft b{color:var(--accent)}
.chips.small .chip{padding:6px 11px;font-size:.84rem}
.pill.card{background:var(--accent-soft);color:var(--accent)}
.pill.cash{background:var(--save-soft);color:var(--save)}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.date{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.date .d1{font-family:var(--f-display);font-weight:700;font-size:1.05rem;text-transform:capitalize}
.date.due{background:var(--debt-soft)}
.date.due .d2{color:var(--debt);font-weight:600}
.cardname{display:flex;align-items:center;gap:10px}
.cardname .chipcard{width:34px;height:24px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--ink));flex:0 0 auto}
.split{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.split b{font-family:var(--f-num);color:var(--ink);font-weight:600}

.filebtn{display:inline-flex;align-items:center;font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-size:15px}
.tabs nav{grid-template-columns:repeat(6,1fr)}
.tabs button{font-size:.7rem;padding:8px 1px}
/* Plan mes a mes */
.pmes{display:flex;flex-direction:column;gap:10px}
.pmes .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pmes .head h2{text-transform:capitalize}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) 108px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl .sg{font-family:var(--f-num);font-weight:600;width:1.1em;text-align:center}
.pl.in .sg{color:var(--save)} .pl.out .sg{color:var(--debt)}
.pl input{font-family:var(--f-num);text-align:right;padding:6px 9px}
.pl .n{min-width:0;overflow-wrap:anywhere}
.pl .n small{display:block;color:var(--muted);font-size:.78rem}
.queda{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 12px;font-weight:600}
.queda .num{font-size:1.1rem}
.queda.ok .num{color:var(--save)} .queda.bad{background:var(--debt-soft)} .queda.bad .num{color:var(--debt)}
.chk{border-radius:999px;padding:4px 10px;font-size:.78rem}
.chk[aria-pressed="true"]{background:var(--save-soft);color:var(--save);border-color:var(--save)}

/* Mi vida: áreas, pendientes, agenda y hábitos */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.atag{display:inline-flex;align-items:center;gap:5px}
.meta{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;color:var(--muted);font-size:.8rem}
.venc{color:var(--debt);font-weight:600}
.item.vt{grid-template-columns:auto minmax(0,1fr) auto}
.item.v3{grid-template-columns:3.2em minmax(0,1fr) auto}
.item .d .pill+.enlace,.item .d .enlace{margin-top:4px}
.item .d>.pill.ahorro{margin-top:4px}
.item .d b .pill{vertical-align:1px}
.tick{width:30px;height:30px;padding:0;border-radius:50%;background:var(--sunk);color:var(--save);display:grid;place-items:center;font-size:.9rem;line-height:1}
.tick[aria-pressed="true"]{background:var(--save-soft);border-color:var(--save)}
.tachado{color:var(--muted);text-decoration:line-through}
.enlace{background:transparent;border:0;padding:0;color:var(--accent);font-size:.85rem;text-align:left}
.stat.wide{grid-column:1/-1}
.mas{border-top:0;padding:0}
.mas summary{font-size:.85rem;color:var(--muted)}
.masin{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.check{flex-direction:row;align-items:center;gap:8px;font-size:.9rem}
.check input{width:auto}
.filarea{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 2px}
.filarea:first-child{border-top:0}
.filarea .fa small{display:block;color:var(--muted);font-weight:500}
.filarea .fm{display:flex;flex-direction:column;align-items:flex-end;font-size:.85rem}
.pos{color:var(--save)}
.volver{align-self:flex-start;padding-inline:0;margin-bottom:-10px}
.dia{gap:8px;padding-block:12px}
.dia.esHoy{border-color:var(--accent)}
.dias{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.dias legend{font-size:.8rem;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.diachk{position:relative;display:block}
.diachk input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.diachk span{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);color:var(--ink);font-size:.85rem}
.diachk input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.diachk input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hdias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.hd{display:flex;flex-direction:column;align-items:center;padding:6px 0;font-family:var(--f-num);font-size:.82rem;background:var(--sunk);line-height:1.25}
.hd small{font-family:var(--f-body);color:var(--muted);font-size:.68rem}
.hd.esHoy{border-color:var(--accent)}
.hd[aria-pressed="true"]{background:var(--save-soft);border-color:var(--save);color:var(--save)}
.hd[aria-pressed="true"] small{color:inherit}
.nota{overflow-wrap:anywhere}

/* Estilo cálido: tarjetas suaves sobre fondo durazno, línea de tiempo y botón flotante */
.card{border:0;border-radius:var(--r);box-shadow:var(--sombra)}
.stat{border:0;border-radius:16px;background:var(--sunk)}
button{border-radius:999px}
input,select{border-radius:14px;border-color:transparent}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:none}
.pill{text-transform:none;letter-spacing:0;font-weight:600;font-size:.74rem;padding:3px 9px}
.tabs{background:var(--surface);border-top:0;box-shadow:0 -6px 24px var(--sombra-c);border-radius:24px 24px 0 0}
.tabs button{border-radius:16px}
.tabs button[aria-current="page"]{color:var(--accent-fuerte);background:var(--accent-soft)}
.toast{z-index:12}
.bar{height:10px}
.bar.grad>i,.bar.save>i{background:linear-gradient(90deg,var(--naranja),var(--naranja-claro))}
.saludo{display:flex;justify-content:space-between;align-items:center;gap:12px}
.saludo h1{font-size:2rem;font-weight:600}
.fechaT{color:var(--muted)}
.fechaT::first-letter{text-transform:uppercase}
.avatar{width:50px;height:50px;padding:0;border:0;border-radius:50%;background:var(--accent-soft);color:var(--accent-fuerte);font-size:1.25rem;font-weight:700;flex:0 0 auto}
.tira{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.tdia{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:0;padding:2px 0;color:var(--ink);font-weight:500}
.tdia small{color:var(--muted);font-size:.8rem}
.tdia.esHoy small{color:var(--ink);font-weight:700}
.tdia span{display:grid;place-items:center;width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;background:var(--surface);box-shadow:var(--sombra);font-size:.98rem}
.tdia[aria-pressed="true"] span{background:var(--oscuro);color:var(--oscuro-ink)}
.tdia i{width:5px;height:5px;border-radius:50%;background:transparent}
.tdia i.hay{background:var(--naranja)}
.heroP{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:18px}
.heroT{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.heroT h2{font-size:1.25rem}
.heroT p{margin:0;font-size:.92rem;overflow-wrap:anywhere}
.heroT .primary{padding:8px 16px;font-size:.88rem;margin-top:2px}
.campana{width:92px;height:92px}
.campana .c1{fill:var(--naranja)}
.campana .c2{fill:var(--accent-fuerte)}
.campana .c3{fill:none;stroke:var(--verde);stroke-width:4;stroke-linecap:round}
.campana .c4{fill:none;stroke:var(--surface);stroke-width:4;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.campana{transform-origin:50% 12%;animation:vaiven 1.4s ease-in-out 1}}
@keyframes vaiven{20%{transform:rotate(9deg)}45%{transform:rotate(-7deg)}70%{transform:rotate(4deg)}}
.avance{background:var(--surface);border-radius:var(--r);box-shadow:var(--sombra);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>.row h2,.sec>h2{font-size:1.2rem;font-weight:600}
.tl{display:flex;flex-direction:column;gap:10px;position:relative}
.fila{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;position:relative}
.fila:not(:last-child)::after{content:"";position:absolute;left:14px;top:calc(50% + 16px);height:calc(50% - 6px);border-left:2px dotted var(--line)}
.punto{width:12px;height:12px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--naranja);justify-self:center}
.tick{width:26px;height:26px;justify-self:center;padding:0;border-radius:50%;border:2px solid var(--muted);background:transparent;color:#fff;display:grid;place-items:center;font-size:.8rem;line-height:1}
.tick[aria-pressed="true"]{background:var(--naranja);border-color:var(--naranja)}
.ficha{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--sombra);min-width:0;width:100%}
.botonf{border:0;text-align:left;font-weight:400;color:inherit}
.ficha .d{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.ficha .d b{font-weight:600;overflow-wrap:anywhere}
.ico{--c:var(--a6);width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;border-radius:13px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c)}
.ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cuando{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;border-left:1px solid var(--line);padding-left:10px;font-size:.78rem;color:var(--muted);text-align:center;white-space:nowrap}
.cuando .rel{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.cuando span{color:var(--ink);font-weight:500}
.cuando small{font-size:.72rem}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--sombra);padding:16px;text-align:left;font-weight:400;min-width:0}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.tile b{font-weight:600;font-size:1rem;margin-top:6px;overflow-wrap:anywhere}
.tile small{color:var(--muted)}
.tm{display:flex;gap:10px;flex-wrap:wrap;font-size:.86rem;font-weight:500;margin-top:4px}
.meta-f{display:flex;flex-direction:column;gap:7px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;padding:0;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:1.9rem;font-weight:300;line-height:1;box-shadow:0 10px 24px var(--sombra-c);z-index:6}
.hoja-fondo{position:fixed;inset:0;background:rgba(20,12,8,.42);z-index:8}
.hoja{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;z-index:9}
.forma{display:flex;flex-direction:column;gap:14px}
.hd{border-radius:12px;border:0}
.hd[aria-pressed="true"]{background:var(--save-soft);color:var(--save)}
.hd.esHoy{outline:2px solid var(--naranja);outline-offset:-2px}
.dia.esHoy{border:0}
.wrap{padding-block:20px 170px}

textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:14px;padding:10px 12px;width:100%;min-width:0;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pl{grid-template-columns:auto minmax(0,1fr) 92px auto}
.pl-nueva{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.pl-nueva .grow{grid-column:1/-1}
.pl-nueva button{grid-column:1/-1}
.prog-conf .grow{display:flex;flex-direction:column;gap:6px}
.prog-bot{margin-top:6px}
.prog-bot button{font-size:.88rem;padding:8px 12px}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
input,select{font-size:16px}

</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><div><div class="eyebrow">Mi vida y cuentas</div><h1>Cargando…</h1></div></div>
</div>
<div class="tabs"><nav id="tabs" aria-label="Secciones"></nav></div>
<div class="toast" id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
